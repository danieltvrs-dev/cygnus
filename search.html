<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus — Busca</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:     #F5C518;
    --accent-rgb: 245,197,24;
    --accent-glow:rgba(245,197,24,0.25);
    --bg:         #07070D;
    --bg2:        #0E0E18;
    --bg3:        #13131F;
    --sidebar-w:  64px;
    --header-h:   68px;
    --t:          0.25s ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); font-family:'Outfit',sans-serif; color:#fff; overflow-x:hidden; min-height:100vh; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:99px; }

  /* ══ HEADER ══ */
  .header {
    position:fixed; top:0; left:0; right:0;
    height:var(--header-h); z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px 0 20px;
    background:rgba(7,7,13,0.97);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .header-left { display:flex; align-items:center; gap:20px; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .logo img { width:36px; height:36px; object-fit:contain; border-radius:8px; }
  .logo-text { font-family:'Montserrat',sans-serif; font-weight:200; font-size:0.9rem; letter-spacing:0.5em; text-indent:0.5em; color:rgba(255,255,255,0.82); }
  .back-btn { display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.5); text-decoration:none; font-size:0.85rem; font-weight:500; padding:7px 14px; border-radius:8px; transition:all var(--t); border:1px solid rgba(255,255,255,0.08); }
  .back-btn:hover { color:#fff; background:rgba(255,255,255,0.06); }
  .profile-pill { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:10px; cursor:pointer; text-decoration:none; transition:background var(--t); }
  .profile-pill:hover { background:rgba(255,255,255,0.06); }
  .profile-pill img { width:34px; height:34px; border-radius:7px; object-fit:cover; border:2px solid var(--accent); box-shadow:0 0 10px var(--accent-glow); }
  .profile-pill span { font-size:0.82rem; font-weight:500; color:rgba(255,255,255,0.7); }

  /* ══ SIDEBAR ══ */
  .sidebar { position:fixed; left:0; top:var(--header-h); bottom:0; width:var(--sidebar-w); z-index:150; background:rgba(7,7,13,0.5); backdrop-filter:blur(16px); border-right:1px solid rgba(255,255,255,0.04); display:flex; flex-direction:column; padding:20px 0; transition:width var(--t); overflow:hidden; }
  .sidebar:hover { width:220px; background:rgba(7,7,13,0.97); border-right-color:rgba(245,197,24,0.1); }
  .sidebar-item { display:flex; align-items:center; gap:14px; padding:12px 20px; cursor:pointer; transition:all var(--t); white-space:nowrap; border-left:2px solid transparent; text-decoration:none; color:rgba(255,255,255,0.4); }
  .sidebar-item:hover { color:#fff; background:rgba(255,255,255,0.05); border-left-color:var(--accent); }
  .sidebar-item.active { color:var(--accent); border-left-color:var(--accent); background:rgba(245,197,24,0.06); }
  .sidebar-icon { flex-shrink:0; width:26px; display:flex; align-items:center; justify-content:center; }
  .sidebar-icon svg { width:18px; height:18px; }
  .sidebar-label { font-size:0.85rem; font-weight:500; opacity:0; transition:opacity 0.2s ease; }
  .sidebar:hover .sidebar-label { opacity:1; }
  .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:10px 14px; }

  /* ══ MAIN ══ */
  .main { margin-left:var(--sidebar-w); padding-top:var(--header-h); min-height:100vh; }

  /* ══ SEARCH HERO ══ */
  .search-hero {
    padding:52px 60px 40px;
    background:linear-gradient(to bottom, rgba(245,197,24,0.04) 0%, transparent 100%);
    border-bottom:1px solid rgba(255,255,255,0.04);
  }

  .search-label {
    font-size:0.68rem; font-weight:700;
    color:rgba(255,255,255,0.3);
    letter-spacing:0.2em; text-transform:uppercase;
    margin-bottom:20px;
    display:flex; align-items:center; gap:10px;
  }
  .search-label::before { content:''; width:3px; height:14px; background:var(--accent); border-radius:99px; }

  /* Campo de busca principal */
  .search-box {
    position:relative;
    max-width:720px;
    margin-bottom:20px;
  }

  .search-icon {
    position:absolute; left:20px; top:50%; transform:translateY(-50%);
    color:rgba(255,255,255,0.3); transition:color var(--t); pointer-events:none;
  }
  .search-icon svg { width:22px; height:22px; }

  .search-input {
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:18px 56px 18px 56px;
    font-family:'Outfit',sans-serif;
    font-size:1.1rem; font-weight:400;
    color:#fff; outline:none;
    transition:all var(--t);
    caret-color:var(--accent);
  }
  .search-input::placeholder { color:rgba(255,255,255,0.2); }
  .search-input:focus {
    background:rgba(255,255,255,0.08);
    border-color:rgba(245,197,24,0.4);
    box-shadow:0 0 0 4px rgba(245,197,24,0.06), 0 8px 40px rgba(0,0,0,0.3);
  }
  .search-input:focus + .search-icon { color:rgba(245,197,24,0.6); }

  .search-clear {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:none;
    color:rgba(255,255,255,0.4); cursor:pointer;
    display:none; align-items:center; justify-content:center;
    transition:all var(--t); font-size:0.85rem;
  }
  .search-clear:hover { background:rgba(255,255,255,0.15); color:#fff; }
  .search-clear.show { display:flex; }
  .search-clear svg { width:14px; height:14px; }

  /* Filters */
  .filters {
    display:flex; align-items:center; gap:8px;
    flex-wrap:wrap;
  }

  .filter-btn {
    padding:7px 16px; border-radius:99px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);
    font-family:'Outfit',sans-serif; font-size:0.78rem; font-weight:500;
    color:rgba(255,255,255,0.5); cursor:pointer;
    transition:all var(--t); white-space:nowrap;
  }
  .filter-btn:hover { border-color:rgba(255,255,255,0.2); color:#fff; background:rgba(255,255,255,0.07); }
  .filter-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(245,197,24,0.08); }

  .filter-sep { width:1px; height:20px; background:rgba(255,255,255,0.08); }

  /* ══ CONTEÚDO DA BUSCA ══ */
  .search-content { padding:0 60px 60px; }

  /* Estado inicial — categorias em destaque */
  .browse-section { padding-top:40px; }

  .browse-title {
    font-size:0.72rem; font-weight:700;
    color:rgba(255,255,255,0.3); letter-spacing:0.14em; text-transform:uppercase;
    margin-bottom:20px; display:flex; align-items:center; gap:10px;
  }
  .browse-title::before { content:''; width:3px; height:14px; background:var(--accent); border-radius:99px; }

  .genre-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:12px;
    margin-bottom:48px;
  }

  .genre-card {
    position:relative; border-radius:14px; overflow:hidden;
    aspect-ratio:16/9; cursor:pointer;
    transition:transform var(--t), box-shadow var(--t);
  }
  .genre-card:hover { transform:scale(1.04); box-shadow:0 12px 40px rgba(0,0,0,0.5); }

  .genre-card-bg {
    position:absolute; inset:0;
    background-size:cover; background-position:center;
  }
  .genre-card-overlay {
    position:absolute; inset:0;
    display:flex; align-items:flex-end;
    padding:14px;
  }
  .genre-card-name {
    font-size:0.88rem; font-weight:700;
    color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }

  /* ══ RESULTADOS ══ */
  .results-section { padding-top:32px; display:none; }
  .results-section.show { display:block; }

  .results-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px;
  }

  .results-count {
    font-size:0.82rem; color:rgba(255,255,255,0.4);
  }
  .results-count strong { color:#fff; font-weight:700; }

  .results-sort {
    display:flex; align-items:center; gap:8px;
    font-size:0.78rem; color:rgba(255,255,255,0.4);
  }
  .sort-select {
    background:var(--bg2); border:1px solid rgba(255,255,255,0.08);
    border-radius:8px; padding:6px 12px;
    font-family:'Outfit',sans-serif; font-size:0.78rem; color:#fff;
    outline:none; cursor:pointer;
  }

  /* Grid de resultados */
  .results-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:16px;
  }

  .result-card {
    position:relative; border-radius:12px; overflow:visible;
    cursor:pointer; transition:transform 0.3s ease;
  }
  .result-card:hover { transform:scale(1.07); z-index:10; }

  .result-poster {
    width:100%; aspect-ratio:2/3; object-fit:cover;
    border-radius:12px; display:block; background:var(--bg2);
    transition:box-shadow 0.3s ease;
  }
  .result-card:hover .result-poster {
    box-shadow:0 12px 40px rgba(var(--accent-rgb),0.2), 0 20px 50px rgba(0,0,0,0.6);
  }

  .result-hover {
    position:absolute; inset:0; border-radius:12px;
    background:linear-gradient(to top, rgba(7,7,13,0.95) 0%, transparent 55%);
    opacity:0; transition:opacity 0.3s ease;
    padding:12px; display:flex; flex-direction:column; justify-content:flex-end;
  }
  .result-card:hover .result-hover { opacity:1; }

  .result-play {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-60%);
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,0.12); backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,0.28);
    display:flex; align-items:center; justify-content:center;
    font-size:0.9rem; transition:all 0.3s ease; opacity:0;
  }
  .result-card:hover .result-play { opacity:1; transform:translate(-50%,-50%); }
  .result-play:hover { background:var(--accent) !important; border-color:var(--accent); color:#07070D; }

  .result-title { font-size:0.76rem; font-weight:700; color:#fff; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-meta  { font-size:0.65rem; color:rgba(255,255,255,0.45); }
  .result-rating { color:var(--accent); font-weight:600; }

  /* ══ LOADING ══ */
  .loading {
    display:none; align-items:center; justify-content:center;
    padding:60px; flex-direction:column; gap:16px;
  }
  .loading.show { display:flex; }
  .spinner {
    width:36px; height:36px;
    border:3px solid rgba(245,197,24,0.15);
    border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-size:0.82rem; color:rgba(255,255,255,0.3); }

  /* ══ EMPTY STATE ══ */
  .empty-state {
    display:none; flex-direction:column; align-items:center;
    padding:80px 40px; text-align:center;
  }
  .empty-state.show { display:flex; }
  .empty-icon { font-size:3rem; margin-bottom:16px; opacity:0.4; }
  .empty-title { font-size:1.2rem; font-weight:700; margin-bottom:8px; }
  .empty-desc  { font-size:0.85rem; color:rgba(255,255,255,0.4); max-width:320px; line-height:1.6; }

  /* ══ PESQUISAS RECENTES ══ */
  .recent-section { padding-top:32px; }
  .recent-title { font-size:0.72rem; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
  .recent-title::before { content:''; width:3px; height:14px; background:var(--accent); border-radius:99px; }

  .recent-list { display:flex; flex-direction:column; gap:2px; max-width:480px; }
  .recent-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    transition:background var(--t); color:rgba(255,255,255,0.6);
    font-size:0.88rem;
  }
  .recent-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
  .recent-icon { color:rgba(255,255,255,0.2); flex-shrink:0; }
  .recent-icon svg { width:16px; height:16px; }
  .recent-remove { margin-left:auto; opacity:0; transition:opacity var(--t); font-size:0.75rem; color:rgba(255,255,255,0.3); }
  .recent-item:hover .recent-remove { opacity:1; }

  /* Skeleton loader */
  .skeleton {
    background:linear-gradient(90deg, var(--bg2) 25%, rgba(255,255,255,0.04) 50%, var(--bg2) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border-radius:12px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skeleton-card { aspect-ratio:2/3; }

  /* ══ MOBILE NAV ══ */
  .mobile-nav { display: none; }

  /* ══ RESPONSIVE ══ */
  @media (max-width: 768px) {
    :root { --sidebar-w: 0px; --header-h: 58px; }

    .sidebar { display: none; }
    .logo-text { display: none; }
    .header { padding: 0 16px; }
    .profile-pill span { display: none; }

    .search-hero { padding: 28px 20px 24px; }
    .search-content { padding: 0 20px 80px; }
    .results-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .genre-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

    .mobile-nav {
      display: flex;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 62px;
      background: rgba(7,7,13,0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.07);
      z-index: 300;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 14px;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: color 0.2s ease;
    }
    .mobile-nav-item.active { color: var(--accent); }
  }

  @media (max-width: 480px) {
    .results-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .genre-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<!-- MAIN -->
<div class="main">

  <!-- SEARCH HERO -->
  <div class="search-hero">
    <p class="search-label">Busca</p>

    <div class="search-box">
      <div class="search-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
      </div>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Filmes, séries, atores, gêneros..."
        autocomplete="off"
        autofocus
      >
      <button class="search-clear" id="clearBtn" onclick="clearSearch()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Filtros -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Tudo</button>
      <button class="filter-btn" onclick="setFilter('movie',this)">Filmes</button>
      <button class="filter-btn" onclick="setFilter('tv',this)">Séries</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" onclick="setFilter('28',this)">Ação</button>
      <button class="filter-btn" onclick="setFilter('878',this)">Sci-Fi</button>
      <button class="filter-btn" onclick="setFilter('18',this)">Drama</button>
      <button class="filter-btn" onclick="setFilter('35',this)">Comédia</button>
      <button class="filter-btn" onclick="setFilter('27',this)">Terror</button>
      <button class="filter-btn" onclick="setFilter('16',this)">Animação</button>
    </div>
  </div>

  <!-- SEARCH CONTENT -->
  <div class="search-content">

    <!-- Estado inicial (sem busca) -->
    <div id="browseState">

      <!-- Pesquisas recentes -->
      <div class="recent-section" id="recentSection">
        <p class="recent-title">Pesquisas Recentes</p>
        <div class="recent-list" id="recentList"></div>
      </div>

      <!-- Navegar por categorias -->
      <div class="browse-section">
        <p class="browse-title">Navegar por Categoria</p>
        <div class="genre-grid" id="genreGrid"></div>
      </div>

    </div>

    <!-- Loading -->
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <span class="loading-text">Buscando...</span>
    </div>

    <!-- Resultados -->
    <div class="results-section" id="resultsState">
      <div class="results-header">
        <p class="results-count" id="resultsCount"></p>
        <div class="results-sort">
          Ordenar por
          <select class="sort-select" id="sortSelect" onchange="sortResults()">
            <option value="popularity">Popularidade</option>
            <option value="rating">Avaliação</option>
            <option value="date">Data</option>
            <option value="title">Título A-Z</option>
          </select>
        </div>
      </div>
      <div class="results-grid" id="resultsGrid"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔭</div>
      <h3 class="empty-title">Nenhum resultado encontrado</h3>
      <p class="empty-desc">Tente outro termo ou explore as categorias abaixo.</p>
    </div>

  </div>
</div>
