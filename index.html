<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#03020A; overflow:hidden; font-family:'Montserrat',sans-serif; }

  /* ══ STARFIELD ══ */
  .starfield { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ══ BARRAS CINEMÁTICAS ══ */
  .bar { position:fixed; left:0; right:0; background:#03020A; z-index:10; }
  .bar-top    { top:0;    height:50vh; animation:openTop 1.8s cubic-bezier(0.77,0,0.18,1) 0.3s forwards; }
  .bar-bottom { bottom:0; height:50vh; animation:openBot 1.8s cubic-bezier(0.77,0,0.18,1) 0.3s forwards; }
  @keyframes openTop { to { height:9vh; } }
  @keyframes openBot { to { height:9vh; } }

  /* ══ SCANLINES ══ */
  .scanlines {
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.055) 3px, rgba(0,0,0,0.055) 4px
    );
  }

  /* ══ LAYOUT CENTRAL ══ */
  .center {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }

  /* ══ SISTEMA DO BURACO NEGRO ══ */
  .bh-system {
    position:relative;
    width:300px; height:300px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:36px;
    opacity:0;
    animation:fadeIn 1s ease 1.6s forwards;
  }
  @keyframes fadeIn { to { opacity:1; } }

  /* ── Jatos relativísticos ── */
  .jet {
    position:absolute;
    left:50%; transform:translateX(-50%);
    width:2px;
    opacity:0;
    animation:fadeIn 1.2s ease 2.4s forwards;
    z-index:1;
  }
  .jet-top {
    bottom:50%; height:130px;
    background:linear-gradient(to top, rgba(130,185,255,0.7) 0%, rgba(100,160,255,0.2) 60%, transparent 100%);
    box-shadow:0 0 6px rgba(130,185,255,0.4);
  }
  .jet-bottom {
    top:50%; height:130px;
    background:linear-gradient(to bottom, rgba(130,185,255,0.7) 0%, rgba(100,160,255,0.2) 60%, transparent 100%);
    box-shadow:0 0 6px rgba(130,185,255,0.4);
  }

  /* ── Disco de acreção — camada de glow ── */
  .disk-glow-wrap {
    position:absolute;
    width:290px; height:290px;
    transform:perspective(600px) rotateX(74deg) rotateZ(0deg);
    animation:diskSpin 8s linear 1.6s infinite;
    filter:blur(18px);
    opacity:0.5;
  }

  /* ── Disco de acreção — principal ── */
  .disk-wrap {
    position:absolute;
    width:270px; height:270px;
    transform:perspective(600px) rotateX(74deg) rotateZ(0deg);
    animation:diskSpin 8s linear 1.6s infinite;
  }

  @keyframes diskSpin {
    from { transform:perspective(600px) rotateX(74deg) rotateZ(0deg); }
    to   { transform:perspective(600px) rotateX(74deg) rotateZ(360deg); }
  }

  /* Conic-gradient simula o beaming relativístico (um lado mais brilhante) */
  .disk {
    width:100%; height:100%;
    border-radius:50%;
    background:conic-gradient(from 80deg,
      rgba(255,55,0,0.07)   0%,
      rgba(255,120,15,0.5)  8%,
      rgba(255,185,70,0.88) 17%,
      rgba(255,235,170,1)   23%,
      rgba(255,255,220,1)   27%,
      rgba(255,210,110,0.85)36%,
      rgba(255,140,25,0.48) 46%,
      rgba(210,60,0,0.12)   60%,
      rgba(150,35,0,0.05)   78%,
      rgba(255,55,0,0.07)   100%
    );
    -webkit-mask:radial-gradient(circle at center,
      transparent 0%, transparent 33%,
      black 39%, black 51%,
      transparent 57%, transparent 100%
    );
    mask:radial-gradient(circle at center,
      transparent 0%, transparent 33%,
      black 39%, black 51%,
      transparent 57%, transparent 100%
    );
  }

  /* ── Anel fotônico (photon sphere) ── */
  .photon-ring {
    position:absolute;
    width:122px; height:122px;
    border-radius:50%;
    border:1.5px solid rgba(255,155,35,0.32);
    box-shadow:
      0 0 16px rgba(255,130,15,0.22),
      inset 0 0 10px rgba(255,130,15,0.12);
    z-index:3;
    opacity:0;
    animation:fadeIn 0.7s ease 2.0s forwards;
  }

  /* ── Pulsos de raio-X ── */
  .xray-pulse {
    position:absolute;
    width:100px; height:100px;
    border-radius:50%;
    border:1px solid rgba(140,200,255,0.55);
    z-index:2;
    opacity:0;
    animation:xpulse 3.2s ease-out infinite;
  }
  .xray-pulse:nth-child(1) { animation-delay:2.6s; }
  .xray-pulse:nth-child(2) { animation-delay:3.7s; }
  .xray-pulse:nth-child(3) { animation-delay:4.8s; }

  @keyframes xpulse {
    0%   { transform:scale(1);   opacity:0.8; border-color:rgba(140,200,255,0.55); }
    100% { transform:scale(3.8); opacity:0;   border-color:rgba(140,200,255,0); }
  }

  /* ── Horizonte de eventos ── */
  .event-horizon {
    position:absolute;
    width:100px; height:100px;
    border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #0c0820 0%, #020109 55%, #000 100%);
    box-shadow:0 0 50px rgba(0,0,0,1), 0 0 100px rgba(0,0,0,0.9);
    z-index:4;
    display:flex; align-items:center; justify-content:center;
  }

  /* ── Logo ── */
  .logo-wrap {
    width:68px; height:68px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
  }
  .logo-img {
    width:68px; height:68px;
    border-radius:15px;
    object-fit:contain;
    display:block;
    opacity:0;
    clip-path:circle(0% at 50% 50%);
    animation:irisReveal 1.1s cubic-bezier(0.4,0,0.2,1) 2.2s forwards;
  }
  @keyframes irisReveal {
    0%   { opacity:1; clip-path:circle(0% at 50% 50%);
           filter:brightness(0) drop-shadow(0 0 0 rgba(245,197,24,0)); }
    50%  { clip-path:circle(62% at 50% 50%);
           filter:brightness(0.55) drop-shadow(0 0 14px rgba(245,197,24,0.35)); }
    100% { clip-path:circle(150% at 50% 50%);
           filter:brightness(1) drop-shadow(0 0 24px rgba(245,197,24,0.6)); }
  }

  /* Flash no reveal */
  .logo-flash {
    position:absolute; inset:0; border-radius:15px;
    background:#fff; opacity:0;
    animation:flash 0.32s ease 2.2s forwards;
  }
  @keyframes flash { 0%{opacity:0.5} 100%{opacity:0} }

  /* Sweep de luz */
  .logo-sweep {
    position:absolute; inset:0;
    background:linear-gradient(110deg, transparent 22%, rgba(255,255,255,0.48) 50%, transparent 78%);
    transform:translateX(-160%);
    animation:sweep 0.6s ease 3.4s forwards;
  }
  @keyframes sweep { to { transform:translateX(160%); } }

  /* ══ NOME ══ */
  .brand-letters {
    display:flex; gap:14px;
    align-items:center;
    margin-bottom:10px;
  }
  .brand-letters span {
    font-weight:200;
    font-size:1.08rem;
    letter-spacing:0.05em;
    color:rgba(255,255,255,0.78);
    opacity:0;
    transform:translateY(7px);
    animation:letterUp 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .brand-letters span:nth-child(1){animation-delay:3.55s}
  .brand-letters span:nth-child(2){animation-delay:3.68s}
  .brand-letters span:nth-child(3){animation-delay:3.81s}
  .brand-letters span:nth-child(4){animation-delay:3.94s}
  .brand-letters span:nth-child(5){animation-delay:4.07s}
  .brand-letters span:nth-child(6){animation-delay:4.20s}
  @keyframes letterUp { to { opacity:1; transform:translateY(0); } }

  /* ── Tag X-1 ── */
  .x1-tag {
    font-weight:300;
    font-size:0.6rem;
    letter-spacing:0.4em;
    text-indent:0.4em;
    color:rgba(255,155,40,0.5);
    margin-bottom:22px;
    opacity:0;
    animation:letterUp 0.7s ease 4.45s forwards;
  }

  /* ── Linha decorativa ── */
  .brand-line {
    width:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(245,197,24,0.45), transparent);
    animation:lineGrow 1s ease 4.4s forwards;
  }
  @keyframes lineGrow { to { width:110px; } }

  /* ══ SAÍDA ══ */
  body.exiting { animation:exitPage 0.65s ease forwards; }
  @keyframes exitPage { to { opacity:0; transform:scale(1.04); } }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>
<div class="scanlines"></div>
<div class="bar bar-top"></div>
<div class="bar bar-bottom"></div>

<div class="center">
  <div class="bh-system">

    <!-- Jatos relativísticos -->
    <div class="jet jet-top"></div>
    <div class="jet jet-bottom"></div>

    <!-- Disco de acreção com glow -->
    <div class="disk-glow-wrap"><div class="disk"></div></div>
    <div class="disk-wrap"><div class="disk"></div></div>

    <!-- Pulsos de raio-X -->
    <div class="xray-pulse"></div>
    <div class="xray-pulse"></div>
    <div class="xray-pulse"></div>

    <!-- Anel fotônico -->
    <div class="photon-ring"></div>

    <!-- Horizonte de eventos + logo -->
    <div class="event-horizon">
      <div class="logo-wrap">
        <img class="logo-img" src="assets/images/logo.png" alt="Cygnus">
        <div class="logo-flash"></div>
        <div class="logo-sweep"></div>
      </div>
    </div>

  </div>

  <div class="brand-letters">
    <span>C</span><span>Y</span><span>G</span><span>N</span><span>U</span><span>S</span>
  </div>
  <div class="x1-tag">X - 1</div>
  <div class="brand-line"></div>
</div>

<script src="js/utils/storage.js"></script>
<script>
/* ══ Starfield ══ */
(function () {
  const sf  = document.getElementById('starfield');
  const css = document.createElement('style');
  css.textContent = '@keyframes tw{from{opacity:var(--lo)}to{opacity:var(--hi)}}';
  document.head.appendChild(css);
  for (let i = 0; i < 160; i++) {
    const s  = document.createElement('div');
    const sz = (Math.random() * 1.8 + 0.25).toFixed(2);
    const lo = (Math.random() * 0.07 + 0.02).toFixed(2);
    const hi = (Math.random() * 0.5  + 0.08).toFixed(2);
    s.style.cssText = [
      'position:absolute', 'border-radius:50%', 'background:#fff',
      `width:${sz}px`, `height:${sz}px`,
      `left:${(Math.random() * 100).toFixed(2)}%`,
      `top:${(Math.random()  * 100).toFixed(2)}%`,
      `--lo:${lo}`, `--hi:${hi}`, `opacity:${lo}`,
      `animation:tw ${(Math.random() * 4 + 2.5).toFixed(1)}s ease-in-out `
        + `${(Math.random() * 6).toFixed(1)}s infinite alternate`,
    ].join(';');
    sf.appendChild(s);
  }
})();

/* ══ Redirect ══ */
setTimeout(() => {
  document.body.classList.add('exiting');
  setTimeout(() => {
    window.location.href = 'disclaimer.html';
  }, 620);
}, 5500);
</script>
</body>
</html>
