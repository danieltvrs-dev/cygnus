<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:     #F5C518;
    --accent-rgb: 245,197,24;
    --accent-glow:rgba(245,197,24,0.25);
    --bg:         #07070D;
    --bg2:        #0E0E18;
    --sidebar-w:  64px;
    --header-h:   68px;
    --t:          0.3s ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); font-family:'Outfit',sans-serif; color:#fff; overflow-x:hidden; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:99px; }

  /* ══ HEADER ══ */
  .header {
    position:fixed; top:0; left:0; right:0;
    height:var(--header-h); z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px 0 20px;
    transition:background 0.4s ease;
  }
  .header.scrolled { background:rgba(7,7,13,0.97); backdrop-filter:blur(20px); box-shadow:0 1px 0 rgba(255,255,255,0.05); }
  .header-bg { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(7,7,13,0.9) 0%,transparent 100%); pointer-events:none; z-index:-1; }

  .header-left { display:flex; align-items:center; gap:32px; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .logo img { width:36px; height:36px; object-fit:contain; border-radius:8px; filter:drop-shadow(0 0 10px var(--accent-glow)); }
  .logo-text { font-family:'Montserrat',sans-serif; font-weight:200; font-size:0.9rem; letter-spacing:0.5em; text-indent:0.5em; color:rgba(255,255,255,0.82); }

  .top-nav { display:flex; align-items:center; gap:2px; }
  .top-nav a { text-decoration:none; color:rgba(255,255,255,0.55); font-size:0.88rem; font-weight:500; padding:7px 16px; border-radius:8px; transition:all var(--t); position:relative; }
  .top-nav a:hover { color:#fff; background:rgba(255,255,255,0.06); }
  .top-nav a.active { color:#fff; font-weight:700; }
  .top-nav a.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:20px; height:2px; background:var(--accent); border-radius:99px; }

  .header-right { display:flex; align-items:center; gap:10px; }

  .icon-btn { width:38px; height:38px; border-radius:50%; background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all var(--t); }
  .icon-btn:hover { color:#fff; background:rgba(255,255,255,0.08); }

  .search-wrap { position:relative; }
  .search-expand { position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:8px; background:rgba(7,7,13,0.96); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:0 14px; height:38px; width:0; overflow:hidden; opacity:0; transition:all 0.35s ease; pointer-events:none; }
  .search-expand.open { width:280px; opacity:1; pointer-events:all; }
  .search-expand svg { width:14px; height:14px; color:rgba(255,255,255,0.3); flex-shrink:0; }
  .search-expand input { background:none; border:none; outline:none; color:#fff; font-family:'Outfit',sans-serif; font-size:0.85rem; width:100%; }
  .search-expand input::placeholder { color:rgba(255,255,255,0.22); }

  .search-dropdown { position:absolute; top:calc(100% + 8px); right:0; width:300px; background:rgba(10,10,20,0.98); border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden; display:none; box-shadow:0 20px 60px rgba(0,0,0,0.7); backdrop-filter:blur(20px); z-index:300; }
  .search-dropdown.show { display:block; }
  .search-result { display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; transition:background var(--t); }
  .search-result:hover { background:rgba(255,255,255,0.05); }
  .search-result img { width:36px; height:54px; object-fit:cover; border-radius:6px; }
  .search-result-title { font-size:0.82rem; font-weight:600; }
  .search-result-meta { font-size:0.7rem; color:rgba(255,255,255,0.38); margin-top:2px; }

  .profile-pill { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:10px; cursor:pointer; text-decoration:none; transition:background var(--t); }
  .profile-pill:hover { background:rgba(255,255,255,0.06); }
  .profile-pill img { width:34px; height:34px; border-radius:7px; object-fit:cover; border:2px solid var(--accent); box-shadow:0 0 10px var(--accent-glow); }
  .profile-pill span { font-size:0.82rem; font-weight:500; color:rgba(255,255,255,0.7); }

  /* ══ SIDEBAR ══ */
  .sidebar { position:fixed; left:0; top:var(--header-h); bottom:0; width:var(--sidebar-w); z-index:150; background:rgba(7,7,13,0.5); backdrop-filter:blur(16px); border-right:1px solid rgba(255,255,255,0.04); display:flex; flex-direction:column; padding:20px 0; transition:width var(--t); overflow:hidden; }
  .sidebar:hover { width:220px; background:rgba(7,7,13,0.97); border-right-color:rgba(245,197,24,0.1); }

  .sidebar-item { display:flex; align-items:center; gap:14px; padding:12px 20px; cursor:pointer; transition:all var(--t); white-space:nowrap; border-left:2px solid transparent; text-decoration:none; color:rgba(255,255,255,0.4); }
  .sidebar-item:hover { color:#fff; background:rgba(255,255,255,0.05); border-left-color:var(--accent); }
  .sidebar-item.active { color:var(--accent); border-left-color:var(--accent); background:rgba(245,197,24,0.06); }
  .sidebar-icon { flex-shrink:0; width:26px; display:flex; align-items:center; justify-content:center; color:inherit; }
  .sidebar-label { font-size:0.85rem; font-weight:500; opacity:0; transition:opacity 0.2s ease; }
  .sidebar:hover .sidebar-label { opacity:1; }
  .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:10px 14px; }

  /* ══ MAIN ══ */
  .main { margin-left:var(--sidebar-w); }

  /* ══ HERO ══ */
  .hero { position:relative; height:100vh; overflow:hidden; }

  .hero-slide { position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; z-index:0; }
  .hero-slide.active { opacity:1; z-index:1; }
  .hero-slide.leaving { opacity:0; z-index:0; }

  .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center top; animation:heroZoom 14s ease-in-out infinite alternate; }
  @keyframes heroZoom { from{transform:scale(1)} to{transform:scale(1.04)} }

  .hero-overlay {
    position:absolute; inset:0;
    background:
      linear-gradient(to right, rgba(7,7,13,0.95) 0%, rgba(7,7,13,0.7) 38%, rgba(7,7,13,0.2) 70%, rgba(7,7,13,0.05) 100%),
      linear-gradient(to top, rgba(7,7,13,1) 0%, rgba(7,7,13,0.5) 22%, transparent 50%);
  }

  .hero-content { position:absolute; bottom:130px; left:56px; right:42%; z-index:3; }

  .hero-tag { display:inline-flex; align-items:center; gap:8px; font-size:0.68rem; font-weight:700; color:var(--accent); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:14px; transition:color 0.8s ease; }
  .hero-tag::before { content:''; width:22px; height:2px; background:var(--accent); border-radius:99px; box-shadow:0 0 8px var(--accent-glow); transition:all 0.8s ease; }

  .hero-title { font-size:clamp(3rem,6.5vw,5.8rem); font-weight:900; line-height:0.95; letter-spacing:-0.03em; color:#fff; margin-bottom:18px; text-shadow:0 4px 40px rgba(0,0,0,0.4); }
  .hero-logo { max-width:min(460px,68%); max-height:150px; width:auto; object-fit:contain; filter:drop-shadow(0 4px 24px rgba(0,0,0,0.9)) drop-shadow(0 2px 8px rgba(0,0,0,0.7)); margin-bottom:18px; display:block; animation:logoFadeIn 0.5s ease; }
  @keyframes logoFadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .hero-meta { display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:0.82rem; }
  .hero-year { color:var(--accent); font-weight:600; transition:color 0.8s ease; }
  .hero-dot { width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,0.3); }
  .hero-rating { background:rgba(var(--accent-rgb),0.12); border:1px solid rgba(var(--accent-rgb),0.25); border-radius:4px; padding:1px 7px; font-size:0.68rem; font-weight:700; color:var(--accent); transition:all 0.8s ease; }
  .hero-dur, .hero-genre { color:rgba(255,255,255,0.5); }

  .hero-desc { font-size:0.92rem; font-weight:300; color:rgba(255,255,255,0.65); line-height:1.75; max-width:480px; margin-bottom:28px; }

  .hero-actions { display:flex; align-items:center; gap:12px; }
  .btn-play { display:flex; align-items:center; gap:10px; background:var(--accent); color:#07070D; border:none; border-radius:10px; padding:13px 28px; font-family:'Outfit',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all var(--t); box-shadow:0 4px 20px var(--accent-glow); }
  .btn-play:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-info { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); backdrop-filter:blur(8px); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:13px 24px; font-family:'Outfit',sans-serif; font-size:0.9rem; font-weight:600; cursor:pointer; transition:all var(--t); }
  .btn-info:hover { background:rgba(255,255,255,0.16); transform:translateY(-1px); }

  .hero-progress { position:absolute; bottom:0; left:0; right:0; height:2px; background:rgba(255,255,255,0.06); z-index:5; overflow:hidden; }
  .hero-pf { height:100%; background:var(--accent); box-shadow:0 0 10px var(--accent-glow); transition:background 0.8s ease; }

  /* ══ LOADING SKELETON ══ */
  .skeleton { background:linear-gradient(90deg, var(--bg2) 25%, rgba(255,255,255,0.05) 50%, var(--bg2) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:10px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ══ CARROSSÉIS ══ */
  .content { position:relative; z-index:2; padding-bottom:80px; }

  .row { padding:0 24px 0 44px; margin-bottom:40px; }
  .row-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .row-title { font-size:1rem; font-weight:700; color:#fff; display:flex; align-items:center; gap:10px; }
  .row-title::before { content:''; width:3px; height:18px; background:var(--accent); border-radius:99px; box-shadow:0 0 8px var(--accent-glow); flex-shrink:0; transition:background 0.8s ease; }
  .row-see { font-size:0.72rem; color:var(--accent); font-weight:600; cursor:pointer; opacity:0; transition:opacity var(--t); }
  .row:hover .row-see { opacity:1; }

  .carousel { display:flex; gap:10px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:10px; scrollbar-width:none; cursor:grab; user-select:none; }
  .carousel::-webkit-scrollbar { display:none; }
  .carousel.grabbing { cursor:grabbing; scroll-behavior:auto; }

  .card { flex-shrink:0; width:148px; position:relative; border-radius:10px; overflow:visible; cursor:pointer; transition:transform 0.3s ease; }
  .card:hover { transform:scale(1.1); z-index:10; }
  .card-poster { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:10px; display:block; background:var(--bg2); transition:box-shadow 0.3s ease; }
  .card:hover .card-poster { box-shadow:0 10px 36px rgba(var(--accent-rgb),0.22), 0 20px 50px rgba(0,0,0,0.6); }
  .card-hover { position:absolute; inset:0; border-radius:10px; background:linear-gradient(to top,rgba(7,7,13,0.95) 0%,transparent 55%); opacity:0; transition:opacity 0.3s ease; padding:10px; display:flex; flex-direction:column; justify-content:flex-end; }
  .card:hover .card-hover { opacity:1; }
  .card-play { position:absolute; top:50%; left:50%; transform:translate(-50%,-60%); width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(8px); border:1.5px solid rgba(255,255,255,0.28); display:flex; align-items:center; justify-content:center; font-size:0.85rem; transition:all 0.3s ease; opacity:0; }
  .card:hover .card-play { opacity:1; transform:translate(-50%,-50%); }
  .card-play:hover { background:var(--accent) !important; border-color:var(--accent); color:#07070D; }
  .card-title { font-size:0.72rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-meta { font-size:0.62rem; color:rgba(255,255,255,0.42); margin-top:3px; }

  .card.wide { width:220px; }
  .card.wide .card-poster { aspect-ratio:16/9; }
  .progress-bar { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.15); border-radius:0 0 10px 10px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); transition:background 0.8s ease; }

  /* Partículas */
  .particles { position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .pt { position:absolute; border-radius:50%; background:rgba(255,255,255,0.5); animation:ptFloat linear infinite; }
  @keyframes ptFloat { 0%{transform:translateY(100vh);opacity:0} 10%{opacity:0.35} 90%{opacity:0.08} 100%{transform:translateY(-10vh);opacity:0} }

  /* Hero loader */
  .hero-loader { position:absolute; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10; transition:opacity 0.5s ease; }
  .hero-loader.hidden { opacity:0; pointer-events:none; }
  .loader-spinner { width:40px; height:40px; border:3px solid rgba(245,197,24,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ══ TOP 10 — Layout único Cygnus ══ */
  .top10-carousel {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 16px 0 20px 44px;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
  }
  .top10-carousel::-webkit-scrollbar { display: none; }
  .top10-carousel.grabbing { cursor: grabbing; scroll-behavior: auto; }

  .top10-card-wrap {
    position: relative;
    flex-shrink: 0;
    width: 260px;
    height: 148px;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: transform 0.3s ease;
  }
  .top10-card-wrap:hover { transform: translateY(-4px); z-index: 10; }

  /* Número enorme à esquerda */
  .top10-number {
    position: absolute;
    left: 0; bottom: -16px;
    font-family: "Montserrat", sans-serif;
    font-size: 10rem;
    font-weight: 900;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px rgba(245,197,24,0.15);
    letter-spacing: -0.06em;
    user-select: none;
    pointer-events: none;
    z-index: 1;
    transition: all 0.35s ease;
    width: 120px;
    text-align: center;
  }

  .top10-card-wrap:nth-child(1) .top10-number,
  .top10-card-wrap:nth-child(2) .top10-number,
  .top10-card-wrap:nth-child(3) .top10-number {
    -webkit-text-stroke: 3px rgba(245,197,24,0.35);
  }

  .top10-card-wrap:hover .top10-number {
    -webkit-text-stroke: 3px rgba(245,197,24,0.7);
    text-shadow: 0 0 60px rgba(245,197,24,0.15);
  }

  /* Poster com recorte cinematográfico */
  .top10-poster {
    position: absolute;
    right: 0;
    width: 148px;
    height: 148px;
    object-fit: cover;
    border-radius: 12px;
    z-index: 2;
    transition: all 0.35s ease;
    background: var(--bg2);
    aspect-ratio: auto;
  }

  .top10-card-wrap:hover .top10-poster {
    box-shadow:
      0 0 0 2px rgba(245,197,24,0.4),
      0 16px 40px rgba(0,0,0,0.7),
      0 0 30px rgba(245,197,24,0.08);
    transform: scale(1.04);
  }

  /* Overlay info */
  .top10-hover {
    position: absolute;
    right: 0;
    width: 148px;
    height: 148px;
    border-radius: 12px;
    background: linear-gradient(to top, rgba(7,7,13,0.97) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 3;
  }
  .top10-card-wrap:hover .top10-hover { opacity: 1; }

  .top10-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -60%);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    transition: all 0.3s ease;
    opacity: 0;
    z-index: 4;
  }
  .top10-card-wrap:hover .top10-play { opacity: 1; transform: translate(-50%,-50%); }
  .top10-play:hover { background: var(--accent) !important; border-color: var(--accent); color: #07070D; }

  .top10-title {
    font-size: 0.7rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #fff;
  }
  .top10-meta {
    font-size: 0.6rem; color: rgba(255,255,255,0.45); margin-top: 2px;
  }

  /* Linha amarela decorativa acima do Top 10 */
  .row.top10-row .row-title::before {
    background: var(--accent);
    box-shadow: 0 0 16px rgba(245,197,24,0.5);
    width: 4px; height: 22px;
  }
  .row.top10-row .row-title {
    font-size: 1.05rem;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header" id="header">
  <div class="header-bg"></div>
  <div class="header-left">
    <a href="#" class="logo">
      <img src="assets/images/logo.png" alt="Cygnus">
      <span class="logo-text">CYGNUS</span>
    </a>
    <nav class="top-nav">
      <a href="home.html" class="active">Início</a>
      <a href="catalog.html?type=movie">Filmes</a>
      <a href="catalog.html?type=tv">Séries</a>
      <a href="catalog.html">Catálogo</a>
      <a href="my-list.html">Minha Lista</a>
    </nav>
  </div>
  <div class="header-right">
    <div class="search-wrap" id="searchWrap">
      <button class="icon-btn" onclick="Router.navigate('search.html')" title="Buscar">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      </button>
      <div class="search-expand" id="searchExpand">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar filmes e séries..." oninput="onSearch(this.value)">
      </div>
      <div class="search-dropdown" id="searchDrop"></div>
    </div>
    <a href="profiles.html" class="profile-pill" id="profilePill">
      <img src="https://i.pravatar.cc/150?img=11" alt="Lucas" id="profileAvatar">
      <span id="profileName">Lucas</span>
    </a>
  </div>
</header>

<!-- SIDEBAR -->
<div class="sidebar">
